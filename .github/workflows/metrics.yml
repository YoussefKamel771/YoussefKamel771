name: Metrics

on:
  schedule: [{cron: "0 */12 * * *"}] # every 12 hours
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          user: YoussefKamel771
          template: classic
          base: header, activity, community
          
          config_timezone: Africa/Cairo

          # 🔥 Focus on repos you care about
          repositories_forks: no
          repositories_affiliations: owner, collaborator
          
          # 🧠 Languages (AI-focused)
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          
          # 📊 Activity breakdown (like your screenshot)
          plugin_activity: yes
          plugin_activity_limit: 5
          
          # 🔥 Lines of code (very nice signal)
          plugin_lines: yes
          
          # 🧠 Habits
          plugin_habits: yes
          plugin_habits_days: 14
          
          # 🎯 Filter repos by topics (IMPORTANT)
          plugin_topics: yes
          plugin_topics_mode: starred
